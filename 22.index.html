<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اللاعب عمار دسوقي</title>

<style>
body{
font-family:Tahoma;
background:#0f172a;
color:white;
direction:rtl;
text-align:center;
}

.container{
width:80%;
margin:auto;
margin-top:40px;
background:#1e293b;
padding:30px;
border-radius:12px;
}

img{
width:200px;
border-radius:10px;
margin-top:15px;
}

h1{
color:#38bdf8;
}

.card{
background:#334155;
margin:15px;
padding:15px;
border-radius:8px;
}

span{
color:#facc15;
font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>⚽ اللاعب عمار دسوقي</h1>

<img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png">

<div class="card">
<p><span>العمر:</span> 20 سنة</p>
<p><span>الجنسية:</span> مصري 🇪🇬</p>
<p><span>الرياضة:</span> كرة القدم</p>
</div>

<div class="card">
<h2>الأندية التي لعب لها</h2>
<p>نادي الترسانة</p>
<p>نادي النصر القاهري</p>
<p>نادي الدرعية السعودي 🇸🇦</p>
</div>

<div class="card">
<h2>المنتخب</h2>
<p>منتخب مصر تحت 17 سنة</p>
</div>

</div>

</body>
</html>
